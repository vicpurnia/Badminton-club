name: Build Badminton Premium STABLE (private signing key)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/premium/v25_6/**'
      - '.github/workflows/build-native-v24-stable.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore verified public-safe source
        shell: bash
        run: |
          set -euo pipefail
          cat src/archive/*.b64 > /tmp/badminton-src.b64
          echo '086180d2fedb7a9084986ab65fd00c9d4098d821f22cbf5aee1dc197eae908a7  /tmp/badminton-src.b64' | sha256sum -c -
          base64 -d /tmp/badminton-src.b64 > /tmp/badminton-src.tar.xz
          echo '7dceec606199c51815e7b56ff7500843a4d696c9c14cba167fac6b73c4ef40bd  /tmp/badminton-src.tar.xz' | sha256sum -c -
          tar -xJf /tmp/badminton-src.tar.xz
          test -f app/build.gradle && test -f settings.gradle
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check accounting regressions
        run: bash tools/run_java_regression.sh
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply existing Android compilation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/vinayak/badminton/nativepreview/MainActivity.java")
          s=p.read_text()
          a='onActivityResult(int req,int result,Intent data){super.onActivityResult(req,result,data);'
          b='onActivityResult(int req,int resultCode,Intent data){super.onActivityResult(req,resultCode,data);'
          assert a in s
          s=s.replace(a,b,1)
          s=s.replace('if(result!=RESULT_OK||data==null','if(resultCode!=RESULT_OK||data==null',1)
          s=s.replace('if(req!=PICK_LEDGER||result!=RESULT_OK','if(req!=PICK_LEDGER||resultCode!=RESULT_OK',1)
          a='private void background(Runnable job){io.execute(()->{try{job.run();}catch(Exception e){runOnUiThread(()->error(e));}});}'
          b='@FunctionalInterface interface CheckedJob{void run() throws Exception;}\n  private void background(CheckedJob job){io.execute(()->{try{job.run();}catch(Exception e){runOnUiThread(()->error(e));}});}'
          assert a in s
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Restore premium base
        shell: bash
        run: |
          set -euo pipefail
          base64 -d src/premium/v20-overlay.tar.xz.base64 > /tmp/badminton-v20-ui.tar.xz
          echo '8569d3b987eda3d48ffb41e58c1b8b8b70fe347309a93ae6b4aa99455349f3c9  /tmp/badminton-v20-ui.tar.xz' | sha256sum -c -
          tar -xJf /tmp/badminton-v20-ui.tar.xz
      - name: Apply v24.1 stable update with unchanged package and database
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/vinayak/badminton/nativepreview/MainActivity.java")
          p.write_text(Path("src/premium/v25_6/MainActivity.java").read_text())
          receipt=Path("src/premium/v25_3/HistoricalReceiptsV253.java")
          assert receipt.exists()
          receiptSource=receipt.read_text()
          assert "Not available in imported history" in receiptSource
          assert "Exact payment date not recorded" in receiptSource
          assert "Only an existing positive cash payment" in receiptSource
          assert "Only positive historical cash records" in receiptSource
          assert "This copy does not record a new payment" in receiptSource
          Path("app/src/main/java/com/vinayak/badminton/nativepreview/HistoricalReceiptsV253.java").write_text(receiptSource)
          cash=Path("src/premium/v25_6/CashCorrectionsV256.java").read_text()
          correctionPdf=Path("src/premium/v25_6/CashCorrectionPdfV256.java").read_text()
          Path("app/src/main/java/com/vinayak/badminton/nativepreview/CashCorrectionsV256.java").write_text(cash)
          Path("app/src/main/java/com/vinayak/badminton/nativepreview/CashCorrectionPdfV256.java").write_text(correctionPdf)
          Path("app/src/main/java/com/vinayak/badminton/nativepreview/BackupGuardian.java").write_text(Path("src/premium/v24_3/BackupGuardian.java").read_text())
          pdf=Path("src/premium/v23_1/ClassicLedgerV231.java")
          assert pdf.exists()
          pdfsource=pdf.read_text()
          assert "new PdfDocument.PageInfo.Builder(842,595,1)" in pdfsource
          assert "purchaseDetails" in pdfsource
          assert "2026-02" in pdfsource
          assert "pdf.finishPage(page)" in pdfsource
          Path("app/src/main/java/com/vinayak/badminton/nativepreview/ClassicLedgerV231.java").write_text(pdf.read_text())
          s=p.read_text()
          assert "SAVE CLASSIC PDF · A4 LANDSCAPE" in s
          assert "monthPicker()" in s
          assert "if(req==SAVE_PDF)" in s
          assert "chooseMonth(" in s
          assert "Monthly receipts" in s
          assert "restoreHistoricalPack" in s
          assert "historicalDonationRecorded" in s
          assert "verifyClassicPdf" in s
          assert "BackupGuardian.save" in s
          assert "CHOOSE EXTERNAL BACKUP FOLDER" in s
          assert "PICK_BACKUP_TREE" in s
          guardian=Path("src/premium/v24_3/BackupGuardian.java").read_text()
          assert "lastError(Context context)" in guardian
          assert "verifySavedCopy(Context context,Uri document,File original)" in guardian
          assert "static String recoveryReadiness(Context context)" in guardian
          assert "static final int MAX_BACKUP_BYTES=12_000_000" in guardian
          assert "Backup health" in s
          assert "BackupGuardian.MAX_BACKUP_BYTES" in s
          assert "Recovery readiness" in s
          assert "STABLE v25.6" in s
          assert "openCashCorrection(" in s
          assert "Commit audited correction" in s
          assert "CashCorrectionsV256.append" in s
          assert "renderCashReceipt(" in s
          assert "CANCELED record" in s
          assert "private void previewPdf" in s
          assert "Preview recorded PDF" in s
          assert "No PDF viewer is available" in s
          assert "private void showReceiptLibrary()" in s
          assert "Find or share any past receipt" in s
          assert "RECEIPT LIBRARY · ALL MONTHS" in s
          assert "SEARCH MEMBER, PERIOD OR AMOUNT" in s
          assert "Show next 25 receipts" in s
          assert "Save PDF" in s
          assert "HistoricalReceiptsV253.legacy(this,item.member,item.historical" in s
          assert "renderCashReceipt(item.member,item.payment)" in s
          assert '"cash".equals(c.kind)&&c.amount>0' in s
          assert '"cash".equals(item.kind)&&item.amount>0' in s
          assert "Find or share any past receipt" in s
          assert "Share receipt" in s
          assert "Share statement" in s
          assert "HistoricalReceiptsV253.payment(this,member,payment" in s
          assert "HistoricalReceiptsV253.legacy(this,member,historical" in s
          assert "Stock position from confirmed baseline" in s
          assert "openInventoryCheckpoint()" in s
          assert "InventoryCheckpoint.calculate" in s
          assert "InventoryCheckpoint.updatedJson" in s
          assert "dao.updateInventoryJson(updated)" in s
          assert "checkpointSummary" in s
          assert "Record shuttle usage" in s
          assert "openShuttleUsageForm()" in s
          assert "Shuttles used this month" in s
          assert "Shuttles used all-time" in s
          assert "List<StockUsage> issued=database.dao().stockUsages()" in s
          assert "insertStock(Collections.singletonList(entry))" in s
          assert 'BackupGuardian.save(this,database,"shuttle-usage",true)' in s
          assert "requireImportedLedger()" in s
          assert "result.stockUsage" in s
          assert "current.stockUsage" in s
          assert "Complete recorded member history" in s
          assert "Imported historical periods" in s
          assert "openShuttleDonation()" in s
          assert "Total packs acquired" in s
          assert "Stock accounting basis" in s
          assert "checkedPurchaseDate" in s
          records=Path("app/src/main/java/com/vinayak/badminton/nativepreview/Records.java").read_text()
          dao=Path("app/src/main/java/com/vinayak/badminton/nativepreview/LedgerDao.java").read_text()
          codec=Path("app/src/main/java/com/vinayak/badminton/nativepreview/MigrationCodec.java").read_text()
          assert '@Entity(tableName="stock_usage"' in records
          assert "void insertStock(List<StockUsage> rows)" in dao
          assert '"stockUsage",stock' in codec
          assert 'x.shuttles=v.getLong("shuttles")' in codec
          assert 'e.category="Shuttle pack"' in s
          assert 'c.kind="packs"' in s
          assert "6_000_000" not in s
          assert "warnOnBackupFailure()" in s
          assert "COMPARE SAVED JSON WITH CURRENT LEDGER" in s
          assert "BackupGuardian.verifySavedCopy(this,destination,file)" in s
          assert "MigrationCodec.inspect(json)" in s
          assert "This v24 preview" not in s
          assert "unsigned preview" not in s
          assert "MigrationCodec.inspect(json)" in guardian
          assert "takePersistableUriPermission" in guardian
          assert "ClassicLedgerV231.master" in s
          assert 'PRINT CLASSIC · A4 LANDSCAPE' in s
          assert 'setMediaSize(PrintAttributes.MediaSize.ISO_A4.asLandscape())' in s
          assert 'new FileOutputStream(destination.getFileDescriptor())' in s
          assert 'callback.onLayoutFailed("Please select A4 landscape instead of portrait")' in s
          p=Path("app/build.gradle")
          s=p.read_text()
          assert "premiumv20" in s, "Unknown v20 application identity"
          s=s.replace("premiumv20","premiumv24")
          import os
          s=s.replace("versionCode 20","versionCode "+str(24000+int(os.environ["GITHUB_RUN_NUMBER"])))
          s += '\nandroid { defaultConfig { versionName "25.6.'+os.environ["GITHUB_RUN_NUMBER"]+'" } }\n'
          p.write_text(s)
          manifest=Path("app/src/main/AndroidManifest.xml")
          text=manifest.read_text()
          import re
          text,n=re.subn(r'android:label="[^"]+"','android:label="Badminton Premium"',text,count=1)
          assert n==1
          manifest.write_text(text)
          PY

      - name: Patch existing Room inventory column and verified JSON export
        run: |
          python3 src/premium/v25_2/patch_inventory.py
          python3 - <<'PY'
          from pathlib import Path
          app=Path("app/src/main/java/com/vinayak/badminton/nativepreview")
          dao=(app/"LedgerDao.java").read_text()
          codec=(app/"MigrationCodec.java").read_text()
          model=(app/"LedgerDatabase.java").read_text()
          assert "int updateInventoryJson(String json)" in dao
          assert 'state.put("inventoryStock",new JSONObject(meta.inventoryStockJson))' in codec
          assert 'InventoryCheckpoint.read(inventory.toString())' in codec
          assert "version=1" in model
          assert (app/"InventoryCheckpoint.java").exists()
          assert (app/"ShuttleInventoryMath.java").exists()
          PY
      - name: Integrate immutable cash corrections and verify accounting paths
        run: |
          python3 src/premium/v25_6/patch_cash_corrections.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/vinayak/badminton/nativepreview")
          codec=(root/"MigrationCodec.java").read_text()
          math=(root/"ReportMath.java").read_text()
          classic=(root/"ClassicLedgerV231.java").read_text()
          pdf=(root/"PdfReports.java").read_text()
          assert "cashCorrectionDeltas=CashCorrectionsV256.monthDeltas(ledger)" in codec
          assert "importedCorrectionDeltas=CashCorrectionsV256.monthDeltas(d)" in codec
          assert "CashCorrectionsV256.monthDeltas(meta.inventoryStockJson,payments)" in math
          assert "CashCorrectionsV256.states(meta.inventoryStockJson,contributions)" in classic
          assert "reported==0?\"VOID\"" in pdf
          assert "version=1" in (root/"LedgerDatabase.java").read_text()
          PY
      - name: Regression-test shuttle stock arithmetic
        run: |
          mkdir -p "$RUNNER_TEMP/stock-tests"
          javac -d "$RUNNER_TEMP/stock-tests" src/premium/v25_2/ShuttleInventoryMath.java src/premium/v25_2/InventoryMathSmoke.java
          java -cp "$RUNNER_TEMP/stock-tests" com.vinayak.badminton.nativepreview.InventoryMathSmoke
      - name: Require persistent private signing key
        shell: bash
        env:
          BADMINTON_SIGNING_KEYSTORE_B64: ${{ secrets.BADMINTON_SIGNING_KEYSTORE_B64 }}
          BADMINTON_KEYSTORE_PASSWORD: ${{ secrets.BADMINTON_KEYSTORE_PASSWORD }}
          BADMINTON_KEY_ALIAS: ${{ secrets.BADMINTON_KEY_ALIAS }}
          BADMINTON_KEY_PASSWORD: ${{ secrets.BADMINTON_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BADMINTON_SIGNING_KEYSTORE_B64 BADMINTON_KEYSTORE_PASSWORD BADMINTON_KEY_ALIAS BADMINTON_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions repository secret: $name. No APK will be signed."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$BADMINTON_SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/badminton-stable.keystore"
          test -s "$RUNNER_TEMP/badminton-stable.keystore"
          echo "BADMINTON_SIGNING_FILE=$RUNNER_TEMP/badminton-stable.keystore" >> "$GITHUB_ENV"
      - name: Attach private signing configuration
        run: |
          cat >> app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              badmintonStable {
                storeFile file(System.getenv("BADMINTON_SIGNING_FILE"))
                storePassword System.getenv("BADMINTON_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BADMINTON_KEY_ALIAS")
                keyPassword System.getenv("BADMINTON_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.badmintonStable
              }
            }
          }
          GRADLE
      - name: Compile stable signed APK
        env:
          BADMINTON_KEYSTORE_PASSWORD: ${{ secrets.BADMINTON_KEYSTORE_PASSWORD }}
          BADMINTON_KEY_ALIAS: ${{ secrets.BADMINTON_KEY_ALIAS }}
          BADMINTON_KEY_PASSWORD: ${{ secrets.BADMINTON_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify stable APK signature against permanent release certificate
        env:
          EXPECTED_CERT_SHA256: ${{ vars.BADMINTON_EXPECTED_CERT_SHA256 }}
        shell: bash
        run: bash tools/check-stable-signature.sh app/build/outputs/apk/release/app-release.apk "$EXPECTED_CERT_SHA256"
      - name: Upload signed stable APK
        uses: actions/upload-artifact@v4
        with:
          name: Badminton-Premium-v25.6-STABLE-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
