name: Build Badminton Premium v24 STABLE (private signing key)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore verified public-safe source
        shell: bash
        run: |
          set -euo pipefail
          cat src/archive/*.b64 > /tmp/badminton-src.b64
          echo '086180d2fedb7a9084986ab65fd00c9d4098d821f22cbf5aee1dc197eae908a7  /tmp/badminton-src.b64' | sha256sum -c -
          base64 -d /tmp/badminton-src.b64 > /tmp/badminton-src.tar.xz
          echo '7dceec606199c51815e7b56ff7500843a4d696c9c14cba167fac6b73c4ef40bd  /tmp/badminton-src.tar.xz' | sha256sum -c -
          tar -xJf /tmp/badminton-src.tar.xz
          test -f app/build.gradle && test -f settings.gradle
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check accounting regressions
        run: bash tools/run_java_regression.sh
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply existing Android compilation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/vinayak/badminton/nativepreview/MainActivity.java")
          s=p.read_text()
          a='onActivityResult(int req,int result,Intent data){super.onActivityResult(req,result,data);'
          b='onActivityResult(int req,int resultCode,Intent data){super.onActivityResult(req,resultCode,data);'
          assert a in s
          s=s.replace(a,b,1)
          s=s.replace('if(result!=RESULT_OK||data==null','if(resultCode!=RESULT_OK||data==null',1)
          s=s.replace('if(req!=PICK_LEDGER||result!=RESULT_OK','if(req!=PICK_LEDGER||resultCode!=RESULT_OK',1)
          a='private void background(Runnable job){io.execute(()->{try{job.run();}catch(Exception e){runOnUiThread(()->error(e));}});}'
          b='@FunctionalInterface interface CheckedJob{void run() throws Exception;}\n  private void background(CheckedJob job){io.execute(()->{try{job.run();}catch(Exception e){runOnUiThread(()->error(e));}});}'
          assert a in s
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Restore premium base
        shell: bash
        run: |
          set -euo pipefail
          base64 -d src/premium/v20-overlay.tar.xz.base64 > /tmp/badminton-v20-ui.tar.xz
          echo '8569d3b987eda3d48ffb41e58c1b8b8b70fe347309a93ae6b4aa99455349f3c9  /tmp/badminton-v20-ui.tar.xz' | sha256sum -c -
          tar -xJf /tmp/badminton-v20-ui.tar.xz
      - name: Apply Premium v23.2 UI as a separate side-by-side test app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/vinayak/badminton/nativepreview/MainActivity.java")
          p.write_text(Path("src/premium/v24/MainActivity.java").read_text())
          Path("app/src/main/java/com/vinayak/badminton/nativepreview/BackupGuardian.java").write_text(Path("src/premium/v24/BackupGuardian.java").read_text())
          pdf=Path("src/premium/v23_1/ClassicLedgerV231.java")
          assert pdf.exists()
          pdfsource=pdf.read_text()
          assert "new PdfDocument.PageInfo.Builder(842,595,1)" in pdfsource
          assert "purchaseDetails" in pdfsource
          assert "2026-02" in pdfsource
          assert "pdf.finishPage(page)" in pdfsource
          Path("app/src/main/java/com/vinayak/badminton/nativepreview/ClassicLedgerV231.java").write_text(pdf.read_text())
          s=p.read_text()
          assert "SAVE CLASSIC PDF · A4 LANDSCAPE" in s
          assert "monthPicker()" in s
          assert "if(req==SAVE_PDF)" in s
          assert "chooseMonth(" in s
          assert "Monthly receipts" in s
          assert "restoreHistoricalPack" in s
          assert "historicalDonationRecorded" in s
          assert "verifyClassicPdf" in s
          assert "BackupGuardian.save" in s
          assert "CHOOSE EXTERNAL BACKUP FOLDER" in s
          assert "PICK_BACKUP_TREE" in s
          guardian=Path("src/premium/v24/BackupGuardian.java").read_text()
          assert "MigrationCodec.inspect(json)" in guardian
          assert "takePersistableUriPermission" in guardian
          assert "ClassicLedgerV231.master" in s
          assert 'PRINT CLASSIC · A4 LANDSCAPE' in s
          assert 'setMediaSize(PrintAttributes.MediaSize.ISO_A4.asLandscape())' in s
          assert 'new FileOutputStream(destination.getFileDescriptor())' in s
          assert 'callback.onLayoutFailed("Please select A4 landscape instead of portrait")' in s
          p=Path("app/build.gradle")
          s=p.read_text()
          assert "premiumv20" in s, "Unknown v20 application identity"
          s=s.replace("premiumv20","premiumv24")
          import os
          s=s.replace("versionCode 20","versionCode "+str(24000+int(os.environ["GITHUB_RUN_NUMBER"])))
          p.write_text(s)
          manifest=Path("app/src/main/AndroidManifest.xml")
          text=manifest.read_text()
          import re
          text,n=re.subn(r'android:label="[^"]+"','android:label="Badminton Premium"',text,count=1)
          assert n==1
          manifest.write_text(text)
          PY

      - name: Require persistent private signing key
        shell: bash
        env:
          BADMINTON_SIGNING_KEYSTORE_B64: ${{ secrets.BADMINTON_SIGNING_KEYSTORE_B64 }}
          BADMINTON_KEYSTORE_PASSWORD: ${{ secrets.BADMINTON_KEYSTORE_PASSWORD }}
          BADMINTON_KEY_ALIAS: ${{ secrets.BADMINTON_KEY_ALIAS }}
          BADMINTON_KEY_PASSWORD: ${{ secrets.BADMINTON_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BADMINTON_SIGNING_KEYSTORE_B64 BADMINTON_KEYSTORE_PASSWORD BADMINTON_KEY_ALIAS BADMINTON_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions repository secret: $name. No APK will be signed."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$BADMINTON_SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/badminton-stable.keystore"
          test -s "$RUNNER_TEMP/badminton-stable.keystore"
          echo "BADMINTON_SIGNING_FILE=$RUNNER_TEMP/badminton-stable.keystore" >> "$GITHUB_ENV"
          echo "BADMINTON_KEYSTORE_PASSWORD=$BADMINTON_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BADMINTON_KEY_ALIAS=$BADMINTON_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "BADMINTON_KEY_PASSWORD=$BADMINTON_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Attach private signing configuration
        run: |
          cat >> app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              badmintonStable {
                storeFile file(System.getenv("BADMINTON_SIGNING_FILE"))
                storePassword System.getenv("BADMINTON_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BADMINTON_KEY_ALIAS")
                keyPassword System.getenv("BADMINTON_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.badmintonStable
              }
            }
          }
          GRADLE
      - name: Compile stable signed APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify stable APK signature and certificate fingerprint
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Upload signed stable APK
        uses: actions/upload-artifact@v4
        with:
          name: Badminton-Premium-v24-STABLE-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
