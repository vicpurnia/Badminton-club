name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/archive/**'
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore verified public-safe Android source
        shell: bash
        run: |
          set -euo pipefail
          cat src/archive/*.b64 > /tmp/badminton-src.b64
          echo '086180d2fedb7a9084986ab65fd00c9d4098d821f22cbf5aee1dc197eae908a7  /tmp/badminton-src.b64' | sha256sum -c -
          base64 -d /tmp/badminton-src.b64 > /tmp/badminton-src.tar.xz
          echo '7dceec606199c51815e7b56ff7500843a4d696c9c14cba167fac6b73c4ef40bd  /tmp/badminton-src.tar.xz' | sha256sum -c -
          tar -xJf /tmp/badminton-src.tar.xz
          test -f app/build.gradle && test -f settings.gradle
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run accounting regression
        run: |
          bash tools/run_java_regression.sh
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply verified Android compilation fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/vinayak/badminton/nativepreview/MainActivity.java")
          s = p.read_text()
          old = 'onActivityResult(int req,int result,Intent data){super.onActivityResult(req,result,data);'
          new = 'onActivityResult(int req,int resultCode,Intent data){super.onActivityResult(req,resultCode,data);'
          assert old in s, 'Unexpected migration activity source'
          s = s.replace(old, new, 1)
          s = s.replace('if(result!=RESULT_OK||data==null', 'if(resultCode!=RESULT_OK||data==null', 1)
          s = s.replace('if(req!=PICK_LEDGER||result!=RESULT_OK', 'if(req!=PICK_LEDGER||resultCode!=RESULT_OK', 1)
          old_bg = 'private void background(Runnable job){io.execute(()->{try{job.run();}catch(Exception e){runOnUiThread(()->error(e));}});}'
          new_bg = '@FunctionalInterface interface CheckedJob{void run() throws Exception;}\n  private void background(CheckedJob job){io.execute(()->{try{job.run();}catch(Exception e){runOnUiThread(()->error(e));}});}'
          assert old_bg in s, 'Unexpected background worker source'
          s = s.replace(old_bg, new_bg, 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Badminton-Native-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
