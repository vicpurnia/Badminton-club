name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android project is uploaded
        run: |
          test -f settings.gradle && test -f build.gradle && test -f app/build.gradle || { echo 'Android project not uploaded. Extract the v19 project ZIP and upload the files at the repository root.'; exit 1; }
      - name: Run regression tests
        run: |
          if [ -f tools/run_java_regression.sh ]; then bash tools/run_java_regression.sh; fi
          if [ -f tools/test_migration.py ]; then python3 tools/test_migration.py; fi
          if [ -f tools/check_java_source.sh ]; then bash tools/check_java_source.sh; fi
          if [ -f tools/test_roundtrip_export.py ]; then python3 tools/test_roundtrip_export.py; fi
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Badminton-Native-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
